<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Tarık's Copilot"><meta name="theme-color" content="#05080F"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}body{margin:0}</style></head><body><title>Tarık's Copilot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{color-scheme:dark;--bg:#05080F;--fg:#EEF1F7;--mu:#8B95AB;--gold:#E8C25A;--danger:#FF8A80;--ok:#43D49A;
--g:linear-gradient(135deg,#FFF3B0 0%,#E8C25A 22%,#B88A1E 50%,#F0D275 72%,#9A6B12 100%);
--g2:linear-gradient(180deg,#FFF8CC 0%,#F6D96B 26%,#E0B13A 54%,#B58219 82%,#D2A22C 100%)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Roboto,sans-serif;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
.gt{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.mu{color:var(--mu)}.sm{font-size:13px}.xs{font-size:12px}
h1{font-size:22px;font-weight:600;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px;gap:8px}
.cd{background:linear-gradient(180deg,#131C32,#0A0F1D);border-radius:16px;padding:12px;margin-top:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 -2px 0 rgba(0,0,0,.45),0 10px 18px rgba(0,0,0,.6),0 2px 0 #1C2640}
.gc{border:1.5px solid transparent;background:linear-gradient(180deg,#131C32,#0A0F1D) padding-box,var(--g) border-box}
.dg{border:1.5px solid #8a3b3b;background:linear-gradient(180deg,#2a1417,#150a0c) padding-box,linear-gradient(135deg,#ff9a90,#8a2b2b) border-box}
.btn{border:1px solid #2B3757;border-radius:14px;padding:11px 14px;font-size:15px;background:linear-gradient(180deg,#1E2A48,#0E1528);color:#DDE3F2;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 4px 0 #03050A,0 8px 10px rgba(0,0,0,.5);display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 1px 0 #03050A}
.btn.gold{border:1px solid #7A5A12;background:var(--g2);color:#2A1B02;font-weight:650;box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -2px 0 rgba(120,80,10,.55),0 5px 0 #5E3F08,0 11px 16px rgba(0,0,0,.6),0 0 18px rgba(232,194,90,.18)}
.btn.gold:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 1px 0 #5E3F08}
.btn.big{width:100%;padding:18px;font-size:19px;border-radius:18px;margin-top:6px}
.btn.s{padding:7px 11px;font-size:13px;border-radius:11px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 3px 0 #03050A,0 6px 8px rgba(0,0,0,.45)}
.btn.s.gold{box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 3px 0 #5E3F08,0 6px 8px rgba(0,0,0,.5)}
.btn.red{border-color:#8a3b3b;color:#ffb0a8}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}
.sp{flex:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.st{padding:10px}.st span{display:block;font-size:12px;color:var(--mu)}.st b{display:block;font-size:26px;font-weight:550;margin-top:2px;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin:8px -2px 0;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:20px;padding:8px 14px;font-size:13px;color:#A9B2C7;background:linear-gradient(180deg,#18223C,#0D1426);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 3px 0 #04060C}
.chip.a{background:var(--g2);color:#2A1B02;font-weight:650;box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 3px 0 #5E3F08}
.coin{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid #3B4770;background:radial-gradient(circle at 32% 28%,#2C3654,#121828 72%);color:#E8C25A;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 4px 0 #04060C,0 8px 12px rgba(0,0,0,.55),inset 0 1px 1px rgba(255,255,255,.12)}
.coin.on{border-color:#7A5A12;background:radial-gradient(circle at 32% 28%,#FFF6BE,#E6B945 45%,#8F6410 100%);color:#2A1B02;box-shadow:0 4px 0 #5E3F08,0 8px 12px rgba(0,0,0,.55),inset 0 1px 1px rgba(255,255,255,.8)}
.coin.on svg{fill:#2A1B02}
.coin:active{transform:translateY(3px)}
.in{width:100%;background:#070B15;border:1px solid #26314F;border-radius:12px;padding:10px 12px;color:var(--fg);font:inherit;font-size:16px;box-shadow:inset 0 2px 4px rgba(0,0,0,.6);min-width:0;-webkit-appearance:none;appearance:none}
.in:focus{outline:none;border-color:#B88A1E}
textarea.in{min-height:84px;resize:vertical}
.lbl{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
.dh{font-size:14px;font-weight:600;margin:18px 0 0}
.ev{display:flex;align-items:center;gap:10px}.ev .t{flex:1;min-width:0}.ev .n{font-size:16px;font-weight:550}
.tb{display:flex;gap:16px;align-items:flex-end;margin:3px 0 4px}.arrl{font-size:14px;color:var(--mu);margin-bottom:8px}.arrl b{font-size:20px;font-weight:700;color:#D5DCEA}
.sv{background:linear-gradient(135deg,#FFFFFF 0%,#C9D1E0 24%,#8A94AB 50%,#E8EDF6 72%,#7A8499 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.dh.day{font-size:24px;font-weight:800;letter-spacing:.3px;margin-top:22px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.7))}.tb small{display:block;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;margin-bottom:1px}.tb b{font-size:25px;font-weight:750;line-height:1.05;letter-spacing:.3px}
.city{font-size:20px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;line-height:1.15;margin-bottom:2px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.7))}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{color:var(--mu);font-weight:500;text-align:right;padding:6px 4px}.tbl td{padding:8px 4px;text-align:right;border-top:1px solid #1C2640;white-space:nowrap}.tbl th:first-child,.tbl td:first-child{text-align:left}
.wrap{overflow-x:auto}
.big-n{font-size:30px;font-weight:600}
.pill{display:inline-block;border-radius:10px;padding:2px 8px;font-size:12px;background:#18223C;color:#A9B2C7}
.ok{color:var(--ok)}.bad{color:var(--danger)}
.dock{position:fixed;left:0;right:0;bottom:0;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:flex;justify-content:center;pointer-events:none;z-index:20}
.dock-in{pointer-events:auto;width:100%;max-width:520px;display:flex;gap:6px;padding:8px;border-radius:24px;background:linear-gradient(180deg,#18223C,#080C17);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -2px 0 rgba(0,0,0,.5),0 12px 24px rgba(0,0,0,.75),0 2px 0 #222E4E}
.tab{flex:1;border:0;border-radius:16px;padding:8px 2px 7px;color:#8B95AB;font-size:11px;background:linear-gradient(180deg,#1E2A48,#0E1528);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(0,0,0,.5),0 4px 0 #03050A,0 7px 8px rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.tab.a{color:#2A1B02;font-weight:650;background:var(--g2);transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -2px 0 rgba(120,80,10,.6),0 1px 0 #5E3F08,0 3px 6px rgba(0,0,0,.5),0 0 14px rgba(232,194,90,.35)}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:90vh;overflow-y:auto;background:linear-gradient(180deg,#131C32,#0A0F1D);border-radius:22px 22px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.12)}
.card-de{font-size:20px;font-weight:600;line-height:1.3}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--g2);color:#2A1B02;font-weight:650;padding:9px 16px;border-radius:14px;z-index:60;box-shadow:0 8px 16px rgba(0,0,0,.6)}
</style>
<div id="app"></div>
<div id="layer"></div>
<div class="dock"><div class="dock-in" id="dock"></div></div>
<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IC={search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',pin:'<path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',calc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/>',chat:'<path d="M21 12a8 8 0 0 1-11.5 7.2L3 21l1.8-5.5A8 8 0 1 1 21 12z"/>',bell:'<path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7M10 20a2 2 0 0 0 4 0"/>',star:'<path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.3l1.1-6.2L3 9.7l6.2-.9z"/>',play:'<path d="M7 4l13 8-13 8z"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>',mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',spk:'<path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',plus:'<path d="M12 5v14M5 12h14"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',warn:'<path d="M12 3l10 18H2zM12 10v4M12 17h.01"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/>',pause:'<path d="M8 5v14M16 5v14"/>',bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',wand:'<path d="M5 19L17 7M14 4l1 2 2 1-2 1-1 2-1-2-2-1 2-1zM19 12l.7 1.3L21 14l-1.3.7L19 16l-.7-1.3L17 14l1.3-.7z"/>'};
const ic=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||''}</svg>`;

/* ---------- state ---------- */
const LS='sofor_defteri_v1',LSE='sofor_events_v1';
const def=()=>({shifts:[],incidents:[],phrases:[],fav:{},rem:{},active:null,calc:{},set:{target:25,minwage:13.9,minijob:603,remmin:45,arr:30,showEn:true}});
let S=def();
try{const r=localStorage.getItem(LS);if(r){const o=JSON.parse(r);S=Object.assign(def(),o);S.set=Object.assign(def().set,o.set||{})}}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
let EV={updated:null,events:[]};
try{const r=localStorage.getItem(LSE);if(r)EV=JSON.parse(r)}catch(e){}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let tab='ana',sub={kayit:'vard',hesap:'model'},ui={aiText:'',city:'Hepsi',cat:'Hepsi',restOk:false,listening:false};
let AI=null,DICT=null;

/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const DAYS=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const dfmt=s=>{const d=new Date(s+'T12:00:00');return DAYS[d.getDay()]+' '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'};
const eur=(n,d=2)=>(isFinite(n)?n:0).toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d})+' €';
const num=(n,d=1)=>(isFinite(n)?n:0).toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const toN=v=>{const x=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(x)?x:0};
const mins=t=>{const a=String(t||'0:0').split(':').map(Number);return(a[0]||0)*60+(a[1]||0)};
const hm=m=>{m=Math.max(0,Math.round(m));return Math.floor(m/60)+' sa '+pad(m%60)+' dk'};
const hms=ms=>{const s=Math.floor(ms/1000);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)};
const shiftMin=s=>{let d=mins(s.end)-mins(s.start);if(d<0)d+=1440;return Math.max(0,d-toN(s.brk))};
const sStart=s=>new Date(s.date+'T'+s.start+':00');
const sEnd=s=>{const e=new Date(s.date+'T'+s.end+':00');if(mins(s.end)<mins(s.start))e.setDate(e.getDate()+1);return e};
const money=s=>toN(s.rev)+toN(s.tips)+toN(s.cash);
const toast=t=>{const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)};
const evEnd=e=>{const d=new Date(e.date+'T'+(e.end||e.start||'22:00')+':00');if(e.start&&e.end&&mins(e.end)<mins(e.start))d.setDate(d.getDate()+1);return d};
const evStart=e=>new Date(e.date+'T'+(e.start||e.end||'20:00')+':00');
const venueOf=e=>(EV.venues||{})[e.venue]||null;
const addrLine=e=>{const v=venueOf(e);return v?`<div class="xs mu">${esc(v.addr.replace(/^[^,]*,\s*/,''))}</div>`:''};
const timeBlock=e=>`<div class="tb">${e.start?`<div><small>${e.to&&e.to>e.date?'Açılış':'Başla'}</small><b>${esc(e.start)}</b></div>`:''}<div><small>${e.to&&e.to>e.date?'Kapanış':'Bitiş'}${e.est?' (tahmini)':''}</small><b class="gt">${e.est?'~':''}${esc(e.end||'?')}</b></div></div><div class="arrl">${e.to&&e.to>e.date?'Yoğunluk için orada ol':'Orada ol'}: <b>${arrive(e)}</b></div>`;
const arrive=e=>{const m=(((mins(e.end)-(toN(S.set.arr)||30))%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
const verBtn=e=>`<a class="btn s" style="text-decoration:none" href="https://www.google.com/search?q=${encodeURIComponent(e.title+' '+(e.venue||'')+' '+e.city+' Beginn Ende Uhrzeit')}" target="_blank" rel="noopener">${ic('search',16)} Saati doğrula</a>`;
function mapBtn(e){const v=venueOf(e);const dest=v?v.addr:(e.venue?e.venue+', ':'')+e.city;const u='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(dest)+(v&&v.pid?'&destination_place_id='+encodeURIComponent(v.pid):'')+'&travelmode=driving';return `<a class="btn s gold" style="text-decoration:none" href="${u}" target="_blank" rel="noopener">${ic('pin',16)} Yol tarifi</a>`}

/* ---------- warnings ---------- */
function dayMinutes(date){let m=0;S.shifts.forEach(s=>{if(s.date===date)m+=shiftMin(s)});if(S.active&&ymd(new Date(S.active.ts))===date)m+=activeMin();return m}
function activeMin(){if(!S.active)return 0;const a=S.active;let br=a.brkMs||0;if(a.brkStart)br+=Date.now()-a.brkStart;return Math.max(0,(Date.now()-a.ts-br)/60000)}
function restUntil(){let last=0;S.shifts.forEach(s=>{const e=sEnd(s).getTime();if(e>last)last=e});return last?last+11*3600000:0}
function warnings(){
  const w=[];const dm=dayMinutes(today());
  if(dm>=600)w.push({lvl:'dg',t:'10 saat sınırı aşıldı',x:'Bugün '+hm(dm)+' çalıştın. Dur, dinlen.'});
  else if(dm>=480)w.push({lvl:'gc',t:'8 saat doldu',x:'10 saat sınırına '+hm(600-dm)+' kaldı (10 saat ancak ortalama şartıyla).'});
  const ru=restUntil();
  if(!S.active&&ru>Date.now())w.push({lvl:'gc',t:'11 saat dinlenme sürüyor',x:new Date(ru).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' saatine kadar ('+hm((ru-Date.now())/60000)+' kaldı).'});
  return w;
}
function upcoming(){
  const now=Date.now(),lim=now+24*3600000;
  return EV.events.filter(e=>(S.fav[e.id]||S.rem[e.id])&&evEnd(e)>now&&evEnd(e)<lim).sort((a,b)=>evEnd(a)-evEnd(b));
}

/* ---------- views ---------- */
const TABS=[['ana','Ana','home'],['kayit','Kayıt','list'],['takvim','Takvim','cal'],['hesap','Hesap','calc'],['kartlar','Kartlar','chat']];
function dock(){$('#dock').innerHTML=TABS.map(t=>`<button class="tab${tab===t[0]?' a':''}" data-act="tab" data-v="${t[0]}">${ic(t[2],22)}<span>${t[1]}</span></button>`).join('')}
function chips(list,cur,act){return `<div class="chips">${list.map(([k,l])=>`<button class="chip${cur===k?' a':''}" data-act="${act}" data-v="${esc(k)}">${esc(l)}</button>`).join('')}</div>`}
function stat(l,v,g){return `<div class="cd st"><span>${l}</span><b${g?' class="gt"':''}>${v}</b></div>`}

function vAna(){
  const d=new Date(),td=today();
  let m=dayMinutes(td),rev=0;S.shifts.forEach(s=>{if(s.date===td)rev+=money(s)});
  const ph=m/60,eh=ph>0?rev/ph:0;
  const ym=td.slice(0,7);let mm=0,mr=0;S.shifts.forEach(s=>{if(s.date.slice(0,7)===ym){mm+=shiftMin(s);mr+=money(s)}});
  let h=`<div class="top"><h1 class="gt">Bugün</h1><span class="mu sm">${DAYS[d.getDay()]} ${pad(d.getDate())}.${pad(d.getMonth()+1)}.</span><span class="sp"></span><button class="btn s" data-act="settings">${ic('gear',16)} Yedek · Ayarlar</button></div>`;
  const a=S.active;
  if(!a){
    const ru=restUntil();const need=ru>Date.now()&&!ui.restOk;
    h+=`<button class="btn gold big" data-act="start">${ic('play',24)} ${need?'Başlat (dinlenme dolmadı!)':'Vardiyayı başlat'}</button>`;
    if(need)h+=`<div class="xs mu" style="margin-top:8px">11 saat dinlenme dolmadı. Yine de başlatmak için tekrar bas.</div>`;
  }else{
    h+=`<div class="cd gc" style="text-align:center"><div class="xs mu">${a.brkStart?'MOLADA':'VARDİYA SÜRÜYOR'}</div><div class="big-n gt" id="tm">${hms(activeMin()*60000)}</div></div>
    <div class="g2" style="margin-top:12px"><button class="btn" data-act="brk">${ic('pause')} ${a.brkStart?'Moladan dön':'Mola'}</button><button class="btn gold" data-act="stop">${ic('stop')} Bitir</button></div>`;
  }
  h+=`<div class="g3" style="margin-top:14px">${stat('Saat',num(ph))}${stat('Ciro',eur(rev,0))}${stat('€ / saat',num(eh),1)}</div>`;
  warnings().forEach(x=>{h+=`<div class="cd ${x.lvl}"><div class="gt" style="font-weight:600">${ic('warn',16)} ${esc(x.t)}</div><div style="margin-top:3px">${esc(x.x)}</div></div>`});
  const up=upcoming();
  if(up.length){h+=`<div class="dh gt">Yaklaşan etkinlikler</div>`;
    up.slice(0,4).forEach(e=>{const end=evEnd(e),left=(end-Date.now())/60000,near=S.rem[e.id]&&left<=S.set.remmin;

const CITIES=['Essen','Mülheim','Duisburg','Bochum','Gelsenkirchen','Düsseldorf','Ratingen','Hattingen','Velbert'];
function ics(e){
  try{if(window.self!==window.top)return''}catch(x){return''}
  const f=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
  const en=evEnd(e),t=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SoforDefteri//TR','BEGIN:VEVENT','UID:'+e.id+'@sofor','DTSTAMP:'+f(new Date())+'Z','DTSTART:'+f(en),'DTEND:'+f(new Date(en.getTime()+3600000)),'SUMMARY:'+(e.title+' bitiyor ('+e.city+')').replace(/[,;]/g,' '),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Etkinlik bitiyor','TRIGGER:-PT'+S.set.remmin+'M','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  return `<a class="btn s" style="text-decoration:none" href="data:text/calendar;charset=utf8,${encodeURIComponent(t)}" download="etkinlik.ics">iPhone takvimine ekle</a>`;
}
function evCard(e){
  const big=(e.imp||0)>=3||S.fav[e.id],m=e.to&&e.to>e.date;
  const rng=m?`<div class="xs mu">${e.date.slice(8)}.${e.date.slice(5,7)}. – ${e.to.slice(8)}.${e.to.slice(5,7)}. her gün</div>`:'';
  return `<div class="cd ${big?'gc':''}"><div class="ev"><div class="t"><div class="city gt">${esc(e.city)}</div>${timeBlock(e)}${rng}<div class="n">${esc(e.title)}</div><div class="sm mu">${esc(e.venue||'')}</div>${addrLine(e)}${e.note?`<div class="xs mu" style="margin-top:3px">${esc(e.note)}</div>`:''}</div>
    <button class="coin${S.rem[e.id]?' on':''}" data-act="rem" data-id="${esc(e.id)}" aria-label="Hatırlat">${ic('bell')}</button>
    <button class="coin${S.fav[e.id]?' on':''}" data-act="fav" data-id="${esc(e.id)}" aria-label="Favori">${ic('star')}</button></div><div class="row" style="margin-top:10px;flex-wrap:wrap">${mapBtn(e)}${verBtn(e)}${S.rem[e.id]?ics(e):''}</div></div>`;
}
function vTakvim(){
  let h=`<div class="top"><h1 class="gt">Takvim</h1><span class="sp"></span><span class="mu sm">14 gün</span></div>`;
  h+=chips([['Hepsi','Hepsi'],['Fav','★ Favoriler'],...CITIES.map(c=>[c,c])],ui.city,'city');
  const t0=new Date();t0.setHours(0,0,0,0);const t1=new Date(t0.getTime()+14*86400000);
  if(EV.updated){const age=Math.floor((Date.now()-new Date(EV.updated+'T12:00:00'))/86400000);h+=`<div class="xs ${age>7?'gt':'mu'}" style="margin:2px 0 4px">Son güncelleme: ${dfmt(EV.updated)}${age>7?' · '+age+' gün önce. Claude\'a "etkinlikleri güncelle" de.':''}</div>`}
  const isM=e=>e.to&&e.to>e.date;
  const fl=L=>ui.city==='Fav'?L.filter(e=>S.fav[e.id]):(ui.city!=='Hepsi'?L.filter(e=>e.city===ui.city):L);
  const tdy=today(),lim=ymd(t1);
  let M=fl(EV.events.filter(e=>isM(e)&&e.to>=tdy&&e.date<lim)).sort((a,b)=>a.date.localeCompare(b.date));
  let L=fl(EV.events.filter(e=>{const d=new Date(e.date+'T12:00:00');return !isM(e)&&d>=t0&&d<t1&&evEnd(e)>new Date(Date.now()-3600000)}));
  L.sort((a,b)=>(a.date+(a.end||'')).localeCompare(b.date+(b.end||'')));
  if(!L.length&&!M.length)h+=`<div class="cd mu">Etkinlik yok. Claude'dan güncelleme iste.</div>`;
  if(M.length){h+=`<div class="dh sv day">Günlük süren</div>`;M.forEach(e=>{h+=evCard(e)})}
  let last='';
  L.forEach(e=>{
    if(e.date!==last){last=e.date;const lab=e.date===tdy?'Bugün':dfmt(e.date);h+=`<div class="dh sv day">${lab}</div>`}
    h+=evCard(e)});
  return h;
}

const NW={'sıfır':0,bir:1,iki:2,'üç':3,'dört':4,'beş':5,'altı':6,yedi:7,sekiz:8,dokuz:9,on:10,yirmi:20,otuz:30,'kırk':40,elli:50,'altmış':60,'yetmiş':70,seksen:80,doksan:90};
const isSp=x=>/^\s+$/.test(x);
function numWords(t){
  const toks=t.split(/(\s+)/),out=[];let i=0;
  const isNW=w=>w&&!isSp(w)&&((w in NW)||w==='yüz'||w==='bin'||w==='buçuk'||w==='yarım');
  while(i<toks.length){
    if(isNW(toks[i])){
      let total=0,cur=0,half=0,j=i,last=i;
      while(j<toks.length){const x=toks[j];
        if(isSp(x)){j++;continue}
        if(x in NW){cur+=NW[x];last=j}
        else if(x==='yüz'){cur=(cur||1)*100;last=j}
        else if(x==='bin'){total+=(cur||1)*1000;cur=0;last=j}
        else if(x==='buçuk'||x==='yarım'){half=.5;last=j}
        else break;
        j++}
      out.push(String(total+cur+half));i=last+1;
    }else{out.push(toks[i]);i++}
  }
  return out.join('');
}
function ruleParse(text,now){
  now=now||new Date();
  let t=String(text).toLocaleLowerCase('tr').replace(/[’‘`´']/g,'').replace(/(\d),(\d)/g,'$1.$2').replace(/([;!?,])/g,' $1 ').replace(/\.(?=\s|$)/g,' ');
  t=numWords(t);
  const orig=String(text).trim(),r={},miss=[];
  const mk=(re)=>{const m=re.exec(t);if(m){t=t.slice(0,m.index)+' '.repeat(m[0].length)+t.slice(m.index+m[0].length)}return m};
  const P=n=>String(n).padStart(2,'0');
  /* date */
  let off=null;
  const MON=['ocak','şubat','mart','nisan','mayıs','haziran','temmuz','ağustos','eylül','ekim','kasım','aralık'];
  let m=mk(new RegExp('(\\d{1,2})\\s*('+MON.join('|')+')'));
  let date=null;
  if(m){date=now.getFullYear()+'-'+P(MON.indexOf(m[2])+1)+'-'+P(+m[1])}
  else if((m=mk(/evvelki gün|önceki gün|evvelsi/)))off=-2;
  else if((m=mk(/(?<![a-zçğıöşü])dün/)))off=-1;
  else if((m=mk(/bugün/)))off=0;
  else{const WD=['pazar','pazartesi','salı','çarşamba','perşembe','cuma','cumartesi'];
    m=mk(/(pazartesi|cumartesi|pazar|salı|çarşamba|perşembe|cuma)/);if(m){const w=WD.indexOf(m[1]);off=-(((now.getDay()-w)%7)+7)%7}}
  if(date==null){const d=new Date(now);d.setDate(d.getDate()+(off||0));date=d.getFullYear()+'-'+P(d.getMonth()+1)+'-'+P(d.getDate())}
  r.date=date;
  /* time */
  const hm=(h,mi)=>P(+h)+':'+P(+(mi||0));
  let s=null,e=null;
  if((m=mk(/(\d{1,2})[:.](\d{2})\s*[-–—]\s*(\d{1,2})[:.](\d{2})/))){s=hm(m[1],m[2]);e=hm(m[3],m[4])}
  else if((m=mk(/(\d{1,2})(?::(\d{2}))?\s*(?:den|dan|ten|tan)\s*(\d{1,2})(?::(\d{2}))?\s*(?:e|a|ye|ya|kadar|arası|arasi)?(?![a-zçğıöşü])/))){s=hm(m[1],m[2]);e=hm(m[3],m[4])}
  else if((m=mk(/(\d{1,2})(?::(\d{2}))?\s*[-–—]\s*(\d{1,2})(?::(\d{2}))?\s*(?:arası|arasi)/))){s=hm(m[1],m[2]);e=hm(m[3],m[4])}
  else if((m=mk(/sabah\s*(?:saat\s*)?(\d{1,2})(?::(\d{2}))?.{0,30}?(?:akşam|aksam|öğleden sonra|ogleden sonra)\s*(?:saat\s*)?(\d{1,2})(?::(\d{2}))?/))){s=hm(m[1],m[2]);e=hm(+m[3]<12?+m[3]+12:m[3],m[4])}
  else{
    let a=mk(/(\d{1,2})(?::(\d{2}))?\s*(?:de|da|te|ta)\s*başla\S*/),b=mk(/(\d{1,2})(?::(\d{2}))?\s*(?:de|da|te|ta)\s*(?:bitir|bit|çık)\S*/);
    if(a)s=hm(a[1],a[2]);if(b)e=hm(b[1],b[2]);
    if(!s&&(a=mk(/başlangıç\s*(?:saat\s*)?(\d{1,2})(?::(\d{2}))?/)))s=hm(a[1],a[2]);
    if(!e&&(b=mk(/bitiş\s*(?:saat\s*)?(\d{1,2})(?::(\d{2}))?/)))e=hm(b[1],b[2]);
  }
  if(s&&e){const sh=+s.slice(0,2),eh=+e.slice(0,2);if(eh<sh&&eh<=12&&sh<12){e=hm(eh+12,e.slice(3))}}
  if(s)r.start=s;if(e)r.end=e;
  /* break */
  const U=u=>(u==='saat'||u==='sa')?60:1;
  if((m=mk(/(\d+(?:\.\d+)?)\s*(dk|dak|dakika|saat|sa)?\s*(?:mola|ara verdim)/)))r.brk=Math.round(+m[1]*U(m[2]));
  else if((m=mk(/mola[^\d]{0,12}?(\d+(?:\.\d+)?)\s*(dk|dak|dakika|saat|sa)?/)))r.brk=Math.round(+m[1]*U(m[2]));
  /* km */
  if((m=mk(/(\d+(?:\.\d+)?)\s*(?:km|kilometre|kilometer)/))||(m=mk(/km\s*[:=]?\s*(\d+(?:\.\d+)?)/)))r.km=+m[1];
  /* money */
  const L='(?<![a-zçğıöşü])';
  const KW={rev:L+'(?:ciro|kazan\\S*|uber|hasılat|gelir)',tips:L+'(?:bahşiş|bahsis|tips?)',cash:L+'(?:nakit|cash|elden)',charge:L+'(?:şarj|sarj|yakıt|akaryakıt|benzin|supercharger)',other:L+'(?:otopark|yıkama|yikama|köprü|otoyol|gider|masraf)'};
  const hits=[];for(const k in KW){const re=new RegExp(KW[k],'g');let x;while((x=re.exec(t)))hits.push({k,pos:x.index,end:x.index+x[0].length})}
  hits.sort((a,b)=>a.pos-b.pos);
  const nums=[];{const re=/\d+(?:\.\d+)?/g;let x;while((x=re.exec(t)))nums.push({v:+x[0],pos:x.index,end:x.index+x[0].length,used:false})}
  const style=(nums.length&&hits.length&&nums[0].pos<hits[0].pos)?'before':'after';
  const between=(a,b,self)=>hits.some(h=>h!==self&&h.pos>=a&&h.pos<b);
  const findAfter=h=>nums.find(n=>!n.used&&n.pos>=h.end&&n.pos-h.end<=18&&!between(h.end,n.pos,h));
  const findBefore=h=>{let c=null;nums.forEach(n=>{if(!n.used&&n.end<=h.pos&&h.pos-n.end<=14&&!between(n.end,h.pos,h))c=n});return c};
  hits.forEach(h=>{if(r[h.k]!=null)return;const n=style==='after'?(findAfter(h)||findBefore(h)):(findBefore(h)||findAfter(h));if(n){n.used=true;r[h.k]=n.v}});
  /* incident */
  const inc=/(kaza|çarp\S*|hasar|çizik|göçük|şikayet|sikayet|ceza|radar|polis|arıza)/.exec(t);
  if(inc&&!(r.start&&r.end)&&r.rev==null){
    const c=/kaza|çarp/.test(inc[1])?'kaza':/hasar|çizik|göçük|arıza/.test(inc[1])?'hasar':/şikayet|sikayet/.test(inc[1])?'şikayet':'ceza';
    return {type:'incident',date:r.date,cat:c,title:orig.length>48?orig.slice(0,48)+'…':orig,note:orig};
  }
  r.type='shift';r.note=orig;
  ['start','end','rev'].forEach(k=>{if(r[k]==null)miss.push(k)});
  r._miss=miss;return r;
}

function showParsed(r){
  const miss=r._miss||[];r=Object.assign({},r);delete r._miss;
  const base=Object.assign({date:today()},clean(r));

  sheet(shiftForm(base,'Kontrol et ve kaydet'));
  const m=['start','end','rev'].filter(k=>base[k]==null||base[k]==='');
  const nm={start:'başlangıç',end:'bitiş',rev:'ciro'};
  m.forEach(k=>{const e=$('#f_'+k);if(e)e.style.borderColor='#E8C25A'});
  const h=$('.sheet h1');if(h)h.insertAdjacentHTML('afterend',m.length?`<div class="xs gt" style="margin-top:4px">Bulamadım, altın çerçeveli: ${m.map(k=>nm[k]).join(', ')}. Sen doldur.</div>`:`<div class="xs mu" style="margin-top:4px">Kontrol et, sonra Kaydet.</div>`);
}
async function aiParse(btn){
  const txt=(ui.aiText||'').trim();if(!txt){toast('Önce anlat veya yaz');return}
  const old=btn.innerHTML;btn.disabled=true;btn.textContent='Anlıyorum...';
  let r=null;
  if(AI){
    const prompt=`Bir Uber şoförünün günlük defter asistanısın. Kullanıcı gün özetini Türkçe veya Almanca serbest metinle anlatıyor. SADECE tek bir JSON nesnesi döndür, başka metin yok.
Bugün: ${today()}, saat dilimi Europe/Berlin.
Şema: {"type":"shift"|"incident","date":"YYYY-MM-DD","start":"HH:MM","end":"HH:MM","brk":mola dakika,"rev":Uber ciro euro,"tips":bahşiş euro,"cash":nakit euro,"km":km,"charge":şarj veya yakıt gideri euro,"other":diğer gider euro,"title":"olay başlığı","cat":"kaza|hasar|şikayet|ceza|diğer","note":"kısa not"}
Kurallar: Vardiya anlatılıyorsa type=shift. Kaza, hasar, şikayet, ceza gibi olay ise type=incident. Söylenmeyen alanı null yap, uydurma. Tarih söylenmediyse bugün. "dün" = bir önceki gün. Sayıları sayı olarak ver.
Kullanıcı metni: """${txt}"""`;
    try{const x=await AI.json(prompt);if(x&&x.type)r=x}catch(e){r=null}
  }
  if(!r){try{r=ruleParse(txt)}catch(e){r=null}}
  btn.disabled=false;btn.innerHTML=old;
  if(!r){toast('Anlayamadım, Elle gir');return}
  ui.aiText='';showParsed(r);
}

  mic(){if(!DICT)return;if(ui.listening){DICT.stop();return}DICT.start().catch(()=>{toast('Mikrofon izni yok')})},
  settings(){sheet(settingsHtml())},
  toggleen(){S.set.showEn=!S.set.showEn;save();sheet(settingsHtml());render()},
  copybk(){const t=exportData();(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Kopyalandı ✓')).catch(()=>{sheet(`<h1 class="gt">Yedek</h1><div class="xs mu">Hepsini seç ve kopyala.</div><textarea class="in" id="bk" style="min-height:160px;margin-top:8px" readonly>${esc(t)}</textarea><div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn gold" data-act="close">Tamam</button></div>`);setTimeout(()=>{const e=$('#bk');if(e){e.focus();e.select()}},50)})},
  pastebk(){sheet(`<h1 class="gt">Yedeği yapıştır</h1><div class="xs mu">Kutuya uzun bas, Yapıştır de, sonra Aktar.</div><textarea class="in" id="bkin" style="min-height:140px;margin-top:8px"></textarea><div class="row" style="margin-top:12px"><button class="btn gold" data-act="doimport">Aktar</button><button class="btn" data-act="close">Vazgeç</button></div>`)},
  doimport(){const m=importData(val('bkin'));closeSheet();render();toast(m)},
  wipe(d,b){if(b.dataset.sure){const keep=S.set;S=def();S.set=keep;save();closeSheet();render();toast('Silindi')}else{b.dataset.sure=1;b.textContent='Emin misin? Bas'}},
  close(){closeSheet();render()},
  shade(d,b,e){if(e.target===b)closeSheet()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=act[b.dataset.act];if(f)f(b.dataset,b,e)});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='aitxt'){ui.aiText=t.value;return}
  if(t.dataset.c){S.calc[t.dataset.c]=t.value;save();const c=curCalc(),o=$('#out');if(c&&o)o.innerHTML=c.out();return}
  if(t.dataset.s){S.set[t.dataset.s]=toN(t.value);save()}
});

/* ---------- render ---------- */
function render(){
  const v={ana:vAna,kayit:vKayit,takvim:vTakvim,hesap:vHesap,kartlar:vKartlar}[tab];
  $('#app').innerHTML=v();dock();
}
function loadEvents(){
  try{fetch('events.json?'+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(j=>{if(j&&j.events){EV=j;try{localStorage.setItem(LSE,JSON.stringify(j))}catch(e){}render()}}).catch(()=>{})}catch(e){}
}
async function caps(){
  try{if(window.claude&&claude.use){
    AI=await claude.use('sample');
    try{DICT=await claude.use('dictation')}catch(e){}
    if(DICT){DICT.onFinal(({text})=>{ui.aiText=((ui.aiText||'')+' '+text).trim();const e=$('#aitxt');if(e)e.value=ui.aiText});DICT.onState(({state})=>{ui.listening=state==='listening'})}
    if(tab==='ana'&&!$('#layer').innerHTML)render();
  }}catch(e){}
}
render();loadEvents();caps();
setInterval(()=>{const t=$('#tm');if(t&&S.active)t.textContent=hms(activeMin()*60000)},1000);
setInterval(()=>{if(tab==='ana'&&!$('#layer').innerHTML&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))render()},30000);
try{if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0&&!(window.claude))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
})();
</script>
